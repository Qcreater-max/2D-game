<!DOCTYPE html>
<!-- 仅用于开发：加载真实的渲染代码，用 harness_state.js 里的固定快照出图，不连接服务器。
     用法：?view=world（默认，世界+卡片）| shop | inv -->
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
  // 渲染代码依赖 client.js 里的全局；client.js 会连网，所以这里只复制目录填充那一小段
  const W = 960, H = 540, WEAK_MULT = 1.5, RESIST_MULT = 0.5;
  const WEAPONS = [], ARMORS = [], ELEMENTS = {}, ENEMY_INFO = {};
  function applyCatalog(c) {
    WEAPONS.push(...c.weapons); ARMORS.push(...c.armors);
    Object.assign(ELEMENTS, c.elements); Object.assign(ENEMY_INFO, c.enemies);
  }
  const ctx = document.getElementById('game').getContext('2d');
  ctx.imageSmoothingEnabled = false;
</script>
<script src="../sprites.js"></script>
<script src="../render.js"></script>
<script src="../render_world.js"></script>
<script src="../ui.js"></script>
<script src="harness_state.js"></script>
<script>
  try {
    applyCatalog(SNAPSHOT.level.catalog);
    const view = new URLSearchParams(location.search).get('view') || 'world';
    const st = SNAPSHOT.state;
    if (view !== 'world') { st.game.panel = view; st.game.panelTab = +(new URLSearchParams(location.search).get('tab') || 0);
                            st.game.panelIdx = +(new URLSearchParams(location.search).get('idx') || 0); }
    drawFrame(st, SNAPSHOT.level);
    document.title = 'done';
  } catch (e) { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f66;position:fixed;top:0;font-size:13px">' + e.stack + '</pre>'); }
</script>
</body></html>
